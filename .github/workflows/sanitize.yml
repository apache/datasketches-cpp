name: Sanitize

on:
  pull_request:
    branches:
      - master
  workflow_dispatch:

env:
  BUILD_TYPE: Release

jobs:
  build:
    name: ${{ matrix.config.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        config:
        - {
            name: "Address Sanitizer",
            sanitize: "address",
            cc: "gcc", cxx: "g++"
          }
        - {
            name: "Undefined Behavior Sanitizer",
            sanitize: "undefined,float-cast-overflow",
            cc: "clang", cxx: "clang++"
          }
    env:
      UBSAN_OPTIONS: print_stacktrace=1

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true
          persist-credentials: false
      - name: Configure
        env:
          CC: ${{ matrix.config.cc }}
          CXX: ${{ matrix.config.cxx }}
        run: cmake -B build -S . -DSANITIZE=${{ matrix.config.sanitize }}
      - name: Build C++ unit tests
        run: cmake --build build --config Release
      - name: Run C++ tests
        run: cmake --build build --config Release --target test
