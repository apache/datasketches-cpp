name: License Audit

on:
  push:
    branches:
      - master
      - minhash/main
  pull_request:
    branches:
      - master
      - minhash/main
  workflow_dispatch:

jobs:
  rat:
    name: Apache RAT
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Run Apache RAT
        run: tools/rat-check.sh
