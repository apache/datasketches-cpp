name: Sanitize

on:
  pull_request:
    branches:
      - master
      - minhash/main
  workflow_dispatch:

env:
  BUILD_TYPE: Release

jobs:
  build:
    name: ${{ matrix.sanitizer.name }} (${{ matrix.compiler.cc }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sanitizer:
        - { name: "Address Sanitizer", flags: "address" }
        - { name: "Undefined Behavior Sanitizer", flags: "undefined,float-cast-overflow" }
        compiler:
        - { cc: "gcc", cxx: "g++" }
        - { cc: "clang", cxx: "clang++" }
    env:
      UBSAN_OPTIONS: print_stacktrace=1

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true
          persist-credentials: false
      - name: Configure
        env:
          CC: ${{ matrix.compiler.cc }}
          CXX: ${{ matrix.compiler.cxx }}
        run: cmake -B build -S . -DSANITIZE=${{ matrix.sanitizer.flags }}
      - name: Build C++ unit tests
        run: cmake --build build --config Release
      - name: Run C++ tests
        run: cmake --build build --config Release --target test
